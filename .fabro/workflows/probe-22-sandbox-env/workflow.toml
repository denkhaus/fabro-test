_version = 1

[workflow]
graph = "workflow.fabro"

# Diagnostic probe (fabro-114c): the develop gate's git-identity pin failed
# ONLY inside real run sandboxes (toolchain env, production host) while the
# same tree passed in isolated image reproductions. This probe captures the
# missing datum: the run sandbox's FULL environment, the effective git
# config with origins, the ambient commit identity of a scratch commit with
# nothing configured, and the run branch's own checkpoint identities as the
# sandbox sees them. Evidence rides the stage log; the bench table only
# asserts the capture completed.
[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro-test"

# The bench toolchain environment, repo-declared (ADR-0042, the fabro
# line's develop pattern): the engine cooks this image at run init from
# the checkout — .fabro/Dockerfile carries nushell 0.116.1 for the
# pure-nu probe scripts (the 2026-09-27 port). The build declaration
# overrides the server catalog entry of the same id layer by layer.
[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
dockerfile = { path = "../../Dockerfile" }
