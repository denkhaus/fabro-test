_version = 1

[workflow]
graph = "workflow.fabro"

# UI lab (user session 2026-11-14): specimen for the fork/retry
# self-service exploration. The run's WORK stage makes real file changes
# (checkpoint content); its CHECK stage runs a deliberately faulty
# workflow-owned script (scripts/check.nu, a runtime type error). The
# lab demonstrates that retry/fork replay the PINNED workflow version —
# a fix merged to main afterward never reaches them. Not a bench facet:
# the workbench table does not list it, so no round fires it.

[run.model]
provider = "zai"
name = "glm-4.7"

[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro-test"

[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
dockerfile = { path = "../../Dockerfile" }
