_version = 1

[workflow]
graph = "workflow.fabro"

# Canonical run target: the checkout's origin uses an SSH host alias
# (denkhaus.github.com) that cannot normalize to github.com — declare the
# SCM explicitly so the run target derives without origin sniffing.
[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro-test"

# Mini line: cheap non-reasoning model, no reasoning_effort needed
# (enum is low|medium|high|xhigh|max — glm-4.7 is non-reasoning).
[run.model]
provider = "zai"
name = "glm-4.7"

[run.run_branch]
push = true

# Full PR-pipeline facet: engine-side forge ops, squash, auto-merge.
[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
model = "zai:glm-4.7"

# Terminal notifications to Slack (facet 10): the local server runs the
# Slack socket-mode integration (#dev-fabro). The workbench asserts the
# NotificationSent platform record.
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#dev-fabro"
