_version = 1

[workflow]
graph = "workflow.fabro"

# Canonical run target: the checkout's origin uses an SSH host alias
# (denkhaus.github.com) that cannot normalize to github.com — declare the
# SCM explicitly so the run target derives without origin sniffing.
[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro-test"

# Mini line: cheap non-reasoning model, no reasoning_effort needed
# (enum is low|medium|high|xhigh|max — glm-4.7 is non-reasoning).
[run.model]
provider = "zai"
name = "glm-4.7"

[run.run_branch]
push = true

# Full PR-pipeline facet: engine-side forge ops, squash, auto-merge.
[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
model = "zai:glm-4.7"

# Terminal Slack notifications (facet 10) are a PLATFORM facility: the
# engine ignores workflow-declared [run.notifications] by contract (warn
# at admission). The route lives in the stack settings ([run.notifications]
# in the server's settings.toml, folded into every run spec); the
# workbench's route-ensure provisions it and asserts the notification.sent
# platform record.

# The bench toolchain environment, repo-declared (ADR-0042, the fabro
# line's develop pattern): the engine cooks this image at run init from
# the checkout — .fabro/Dockerfile carries nushell plus the fabro and
# mulch release binaries (stage scripts are pure nu; the mini seed loop
# checks claims through nu). The build declaration overrides the server
# catalog entry of the same id layer by layer.
[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
dockerfile = { path = "../../Dockerfile" }
