_version = 1

[workflow]
graph = "workflow.fabro"

# probe-24 (fabro-6041, the c98c seam): tool-result error-flag handling on
# the DEPLOYED profile path. The agent forces exactly two failing
# fabro_run_search calls (invalid arguments — the mimo incident class);
# every follow-up request must render the error-flagged tool result into
# content ('[TOOL ERROR] ...') for openai-wire profiles (zai resolves to
# the OpenAi profile kind), so the provider wire never has to DROP the
# flag. The bench asserts: >= 2 is_error ToolCallCompleted events AND
# zero 'unsupported_control' Warning events (the real pebble events, not
# string matches — the prompt names the marker words itself).
# GREEN since 2026-10-24 (pebble 47a036fd: the marker replaces the flag;
# probe run 01M5Q5TMJ8 proved the deployed path). A red row blocks the
# next deploy window per the FACETS rule (fabro-6041 N3).
[run.agent]
fabro_tools = true

[run.model]
provider = "zai"
name = "glm-4.7"

[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro-test"
