_version = 1

[workflow]
graph = "workflow.fabro"

# REGRESSION PIN (was known-red until 2026-09-28): asks for a shallow
# depth=10 clone. The petri frontend forces the full history whatever the
# layers ask (fabro-df60 option a, petri 603e40e), so this run MUST
# succeed; a red probe-14 means the hardening regressed (mx-9251c9 class:
# the publish bundle silently truncates at a depth cut).
[run.clone]
depth = 10

[[run.hooks]]
name = "probe-runid-journal"
event = "stage_complete"
script = "nu .fabro/workflows/probe-13-runid/scripts/journal.nu"
blocking = false
timeout = "10s"
sandbox = true

[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro-test"
