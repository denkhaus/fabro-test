_version = 1

[workflow]
graph = "workflow.fabro"

[run.model]
provider = "zai"
name = "glm-4.7"

# The run-branch publish is terminal-SUCCESS-only (run_publish): for
# the FAILED specimen this setting is inert — its checkpoints stay in
# the server-side snapshot repository and the carry finds nothing on
# the origin (work#1320's gap). It rides anyway: the SUCCESSOR
# succeeds, and its branch publishing mirrors the line's real shape.
[run.run_branch]
enabled = true
push = true

[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
# The dockerfile rides INLINE as a TOML literal block: run compile
# rejects the { path } form ("persist-time inlining; this runner reads
# no files here") — the CLI publish path inlines the same way before
# registering a version.
dockerfile = '''__DOCKERFILE__'''
