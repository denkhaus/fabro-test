name: bench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Everything compiles (prestate-safe merge gate)
        run: python3 -m compileall -q bench src tests
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bench test suite (informational between seeds)
        run: python3 -m unittest discover -s tests -v
