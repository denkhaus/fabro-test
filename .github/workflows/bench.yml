name: bench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Everything compiles (prestate-safe merge gate)
        run: python3 -m compileall -q bench src tests
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bench test suite (green on run PRs; red prestate is the task)
        run: python3 -m unittest discover -s tests -v
