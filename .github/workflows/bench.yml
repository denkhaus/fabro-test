name: bench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Everything parses (prestate-safe merge gate)
        run: |
          nu --version
          for f in bench/*.nu tests/*.nu scripts/*.nu .fabro/workflows/*/scripts/*.nu; do
            [ -e "$f" ] || continue
            nu --ide-check 10 "$f" >/dev/null
          done
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Bench acceptance (green on run PRs; red prestate is the task)
        run: nu tests/test-canonical.nu
