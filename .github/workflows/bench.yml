name: bench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Everything parses (prestate-safe merge gate)
        run: |
          nu --version
          nu scripts/lint-nu.nu
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Bench acceptance (green on run PRs; red prestate is the task)
        run: nu tests/test-canonical.nu
      - name: Bench adapter library (gh shape fixtures)
        run: nu tests/test-bench-lib.nu
